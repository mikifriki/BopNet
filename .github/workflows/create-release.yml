name: Build and release Docker image
permissions:
  contents: write
on:
  push:
    tags:
      - 'v*'   # triggers on release tags like v1.0.0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --no-restore --configuration Release

      - name: Publish and validate Linux x64 AOT artifacts and Docker image
        run: bash scripts/publish-linux.sh

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BopNet-linux-x64
          path: ./BopNet/Release

      - name: Save Docker image as tar
        run: docker save bopnet-image -o bopnet-image.tar

      # Create GitHub release
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # Upload Docker tar as release asset
      - name: Upload Docker image tar to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bopnet-image.tar
          asset_name: bopnet-image.tar
          asset_content_type: application/x-tar
