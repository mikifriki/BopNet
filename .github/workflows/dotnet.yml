name: Build BopNet

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore BopNet.sln

      - name: Build
        run: dotnet build BopNet.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test BopNet.sln --no-build --no-restore --configuration Release

      - name: Publish and validate Linux x64 AOT artifacts and Docker image
        run: bash scripts/publish-linux.sh

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BopNet-linux-x64
          path: ./BopNet/Release

      - name: Save Docker image as tar
        run: docker save bopnet-image -o bopnet-image.tar

      - name: Upload Docker image tar
        uses: actions/upload-artifact@v4
        with:
          name: bopnet-image
          path: bopnet-image.tar
