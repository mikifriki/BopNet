name: Build BopNet

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test BopNet.sln -c Release

      - name: Publish Linux x64
        run: bash scripts/publish-linux.sh

      - name: Package standalone release
        run: tar -czf BopNet-linux-x64.tar.gz -C BopNet/Release .

      - name: Check standalone release
        run: |
          mkdir "$RUNNER_TEMP/bopnet-standalone"
          tar -xzf BopNet-linux-x64.tar.gz -C "$RUNNER_TEMP/bopnet-standalone"
          docker run --rm --platform linux/amd64 --network none --user app \
            --mount "type=bind,source=$RUNNER_TEMP/bopnet-standalone,target=/app,readonly" \
            mcr.microsoft.com/dotnet/runtime-deps:10.0-noble /app/BopNet --self-test

      - name: Upload standalone release
        uses: actions/upload-artifact@v4
        with:
          name: BopNet-linux-x64
          path: BopNet-linux-x64.tar.gz
          if-no-files-found: error

      - name: Save Docker image
        run: docker save bopnet-image -o bopnet-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: bopnet-image
          path: bopnet-image.tar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BopNet-linux-x64

      - uses: actions/download-artifact@v4
        with:
          name: bopnet-image

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if response=$(gh api --include "repos/$GH_REPO/releases/tags/$RELEASE_TAG"); then
            gh release upload "$RELEASE_TAG" --clobber \
              BopNet-linux-x64.tar.gz bopnet-image.tar
          elif [ "$(printf '%s\n' "$response" | awk 'NR == 1 { print $2 }')" = "404" ]; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              BopNet-linux-x64.tar.gz bopnet-image.tar
          else
            exit 1
          fi
